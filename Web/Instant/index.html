/* Mechanical close-up panels: large touch handles, no forced viewport scrolling. */
.mechanism-board{width:100%;max-width:600px;margin:8px auto;background:#dce9df;border:3px solid #57735d;overflow:hidden}
#mechanismBoard{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#mechanismBoard [data-plank],#mechanismBoard [data-rotate]{cursor:grab;pointer-events:all}
#machineStatus{min-height:38px;line-height:1.4;font-size:16px;background:#eef0d6;padding:8px;color:#264933}
#machineStatus.ready{background:#c8e6b5;color:#244833}
.mech-tools,.mech-nudge{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.mech-nudge .btn{min-width:48px;font-size:21px}
.mech-slider{display:grid;grid-template-columns:48px 48px 1fr;align-items:center;gap:5px;font-weight:800;margin:7px 0}
.mech-slider input{width:100%;min-width:0;height:36px;touch-action:pan-y;accent-color:#638f52}
.mech-help{font-size:15px;line-height:1.5}.mech-tools [aria-pressed=true]{background:#d4deb0;outline:2px solid #638b51}
@media(max-width:360px){.mech-tools .btn{padding:8px;font-size:14px}.mech-help{font-size:14px}}

 for(let i=0;i<12;i++)bind('key'+i,()=>{if(locked)return;if(i<9&&answer.length<3)answer+=i+1;else if(i===9)answer=answer.slice(0,-1);else if(i===10&&answer.length<3)answer+='0';else if(i===11)submit();render();});let hints=0;bind('hint',()=>{$('feedback').textContent=++hints>1?'함께 확인해요: '+p.answer:p.hint;});keyboard=e=>{if(locked)return;if(/^\d$/.test(e.key)&&answer.length<3){answer+=e.key;render();}else if(e.key==='Backspace'){answer=answer.slice(0,-1);render();}else if(e.key==='Enter')submit();};
}
function ruleUI(id,titleText,boss){const p=C.puzzle(s,id);open(boss?'boss-question':'rule',titleText,`<p class="help" id="questionPrompt">${esc(p.prompt)}</p><div class="stack">${p.options.map((n,i)=>`<button class="btn wide" id="rule${i}">${n}</button>`).join('')}</div><div class="feedback" id="feedback">두 조건을 하나씩 확인해요.</div><button class="btn" id="hint">모모의 힌트</button>`);save();p.options.forEach((n,i)=>bind('rule'+i,()=>{const r=C.submit(s,id,n);if(r.solved)completeUI(id);else{$('feedback').textContent='조건과 다른 답이에요. 다시 골라요.';$('feedback').classList.add('bad');save();}}));bind('hint',()=>{$('feedback').textContent=p.hint;});}
function sequenceUI(id,titleText,boss){const p=C.puzzle(s,id),memory=p.type==='memory',equipment=p.type==='equipment';let previewSerial=0,locked=memory;const symbols=['▲','■','●','◆'];const choices=equipment?[0,1,2,3,4]:memory?[0,1,2,3]:p.sequence.slice();
 const clues=['균열벽을 열려면 어떤 도구가 필요할까?','고장 난 발전기를 고치려면?','높은 리프트에 오르려면?','전기장을 안전하게 지나려면?','숨은 규칙 단서를 찾으려면?'];
 open(boss?'boss-question':memory?'memory':'order',titleText,`<p>${equipment?'상황에 맞는 도구를 선택해요.':memory?'빛나는 순서를 보고, 같은 순서로 눌러요.':'표시된 순서대로 눌러 주세요.'}</p><div class="help center" id="sequencePrompt"></div><div class="equation" id="memoryShow"></div><div class="${equipment?'stack':'memory-keys'}">${choices.map((v,i)=>`<button class="btn" id="seq${i}" data-value="${v}">${equipment?esc(D.tools[v]):memory?symbols[v]:v}</button>`).join('')}</div><div class="feedback" id="feedback"></div>${memory?'<button class="btn wide" id="replay">순서 다시 보기</button>':''}`);save();
 function render(){const n=p.input.length;$('sequencePrompt').textContent=equipment?clues[p.sequence[n]]||'도구 선택 성공!':memory?`${p.sequence.length}개를 기억해요. 다시 보아도 괜찮아요.`:p.sequence.join(' → ');if(!memory)$('memoryShow').textContent=equipment?`${n} / 5`:p.sequence.map((v,i)=>i<n?v+' ✓':v).join('  ');$('feedback').textContent=`${n} / ${p.sequence.length}`;choices.forEach((_,i)=>$('seq'+i).disabled=locked);}
 function preview(){const serial=++previewSerial;locked=true;p.input=[];render();$('memoryShow').textContent=p.sequence.map(i=>symbols[i]).join('  ');$('feedback').textContent='지금 순서를 보세요.';later(()=>{if(serial!==previewSerial)return;locked=false;$('memoryShow').textContent='?  '.repeat(p.sequence.length);render();$('feedback').textContent='같은 순서로 눌러요.';},900+p.sequence.length*150);}
 choices.forEach((value,i)=>bind('seq'+i,()=>{if(locked)return;const r=C.submit(s,id,value);if(r.solved){locked=true;completeUI(id);}else if(!r.ok){if(equipment&&r.code==='craft'){$('feedback').textContent='이 도구를 작업대에서 먼저 만들어 주세요.';return;}render();$('feedback').textContent='괜찮아요. 처음부터 다시 해요.';if(memory)later(preview,400);}else render();save();}));if(memory){bind('replay',preview);preview();}else{locked=false;render();}
}
function pipeSvg(mask,flow){let paths='';const ends=[[30,0],[60,30],[30,60],[0,30]];for(let d=0;d<4;d++)if(mask&(1<<d))paths+=`M30 30 L${ends[d][0]} ${ends[d][1]} `;return`<svg viewBox="0 0 60 60"><path d="${paths}" fill="none" stroke="#536958" stroke-width="15"/><path d="${paths}" fill="none" stroke="${flow?'#f5c86e':'#d5d7b7'}" stroke-width="8"/><circle cx="30" cy="30" r="7" fill="${flow?'#ffebb0':'#bbc6a0'}"/></svg>`;}
function pipeUI(id,titleText,boss){const p=C.puzzle(s,id);let locked=false;open(boss?'boss-question':'pipe',titleText,`<p class="help">왼쪽 입구에서 오른쪽 용광로까지 <b>끊김 없이 연결</b>해요. 칸을 누르면 90° 돌아가요.<br>실제로 흐르는 관만 노랗게 켜져요.</p><div class="pipe-layout"><div class="pipe-end">🔥<br>입구 →</div><div class="pipe-grid">${p.cells.map((cell,i)=>`<button class="pipe-cell" id="pipe${i}" aria-label="배관 ${Math.floor(i/3)+1}행 ${i%3+1}열" ${cell?'':'disabled'}></button>`).join('')}</div><div class="pipe-end">→ 🏭<br>도착</div></div><div class="feedback" id="pipeProgress"></div><div class="feedback" id="feedback"></div><button class="btn small" id="hint">연결 힌트</button>`);
 function render(){const tr=P.pipeTrace(p);p.cells.forEach((cell,i)=>{const e=$('pipe'+i);e.innerHTML=cell?pipeSvg(P.ports(cell,p.rotations[i]),tr.reached.includes(i)):'';e.classList.toggle('flowing',tr.reached.includes(i));});$('pipeProgress').textContent=tr.solved?'용광로에 도착했어요!':`불꽃이 흐르는 관 ${tr.reached.length} / ${p.cells.filter(Boolean).length}`;}
 p.cells.forEach((cell,i)=>{if(cell)bind('pipe'+i,()=>{if(locked)return;P.rotate(p,i);render();save();if(P.solved(p)&&C.completeProblem(s,id)){locked=true;completeUI(id);}});});bind('hint',()=>{$('feedback').textContent='입구에 닿는 관부터 살펴봐요. 두 관의 열린 끝이 서로 마주 봐야 해요.';});render();save();
}
function laserUI(id,titleText,boss){const p=C.puzzle(s,id);let locked=false;open(boss?'boss-question':'laser',titleText,'<p class="help">빛이 수정 <b>◆</b>에 닿도록 거울을 돌려요. 지금 보이는 빛의 경로가 실제 판정이에요.</p><div id="laserBoard" class="laser-board"></div><div class="feedback" id="feedback"></div><button class="btn small" id="hint">반사 힌트</button>');
 function render(){const tr=P.laserTrace(p),pos=([x,y])=>[(x+1)*50+25,y*50+25],points=tr.path.map(v=>pos(v).join(',')).join(' '),[tx,ty]=pos(p.target);let lines='';for(let i=0;i<6;i++)lines+=`<path d="M50 ${i*50}H300 M${50+i*50} 0V250" stroke="#aac3b5" stroke-width="1"/>`;
 $('laserBoard').innerHTML=`<svg viewBox="0 0 350 250" aria-label="레이저 경로">${lines}<text x="8" y="${pos(p.source)[1]+6}" font-size="24" fill="#b47738">→</text><polyline points="${points}" fill="none" stroke="#b48a3d" stroke-width="8"/><polyline points="${points}" fill="none" stroke="#ffe29a" stroke-width="4"/><text x="${tx}" y="${ty+10}" text-anchor="middle" font-size="31" fill="${tr.solved?'#67a780':'#548789'}">◆</text></svg>${p.mirrors.map((m,i)=>{const [x,y]=pos(m);return`<button class="mirror-button" id="mirror${i}" style="left:${x/350*100}%;top:${y/250*100}%" aria-label="거울 ${i+1} 회전">${p.rotations[i]===0?'╱':'╲'}</button>`;}).join('')}`;
 p.mirrors.forEach((_,i)=>bind('mirror'+i,()=>{if(locked)return;P.rotate(p,i);render();save();if(P.solved(p)&&C.completeProblem(s,id)){locked=true;completeUI(id);}}));}
 bind('hint',()=>{$('feedback').textContent='빛이 거울에 닿으면 방향이 꺾여요. 먼저 빛이 닿은 거울부터 돌려 보세요.';});render();save();
}
function sokobanUI(id,titleText,boss){const p=C.puzzle(s,id);let locked=false;open(boss?'boss-question':'sokoban',titleText,'<p>● 탐험가로 ▣ 상자를 밀어 <b>★ 목표 칸</b>에 놓아요. 당기기는 안 돼요.</p><div class="soko-grid" id="sokoGrid"></div><div class="soko-pad"><button class="btn" id="sLeft">←</button><button class="btn" id="sUp">↑</button><button class="btn" id="sDown">↓</button><button class="btn" id="sRight">→</button></div><div class="problem-tools"><button class="btn" id="sUndo">한 칸 되돌리기</button><button class="btn" id="sReset">퍼즐 다시 시작</button></div><div class="feedback" id="feedback"></div>');
 function render(){const g=$('sokoGrid');g.style.gridTemplateColumns=`repeat(${p.width},1fr)`;let html='';for(let y=0;y<p.height;y++)for(let x=0;x<p.width;x++){const is=(v)=>v[0]===x&&v[1]===y,wall=p.walls.some(is),goal=p.goals.some(is),box=p.boxes.some(is),player=is(p.player);html+=`<div class="soko-cell ${wall?'wall':''} ${goal?'goal':''}" aria-label="${box?'상자':player?'탐험가':goal?'목표':'바닥'}">${wall?'':box?(goal?'▣✓':'▣'):player?'●':goal?'★':''}</div>`;}g.innerHTML=html;$('sUndo').disabled=!p.history.length;}
 const move=d=>{if(locked)return;P.sokobanMove(p,d);render();save();if(P.solved(p)&&C.completeProblem(s,id)){locked=true;completeUI(id);}};bind('sUp',()=>move(0));bind('sRight',()=>move(1));bind('sDown',()=>move(2));bind('sLeft',()=>move(3));bind('sUndo',()=>{if(locked)return;P.undo(p);render();save();});bind('sReset',()=>{if(locked)return;P.reset(p);render();save();});render();save();
}
function act(){if(!running||mode||actionLock)return;if(current().carried&&near?.kind!=='scale'){C.interact(s,'drop');save();refresh();notify('상자를 내려놓았어요.');return;}if(!near)return;const t=near;
 if(t.id==='golem'){showBoss();return;}
 const r=C.interact(s,t.id);if(!r.ok){const msg={busy:'도구가 움직이는 중이에요.',far:'조금 더 가까이 가요.',complete:'이미 해결한 장치예요.',owned:'이미 가지고 있어요.',carrying:'먼저 들고 있는 상자를 저울에 놓아요.'};if(['select','equip'].includes(r.code))notify(`아래에서 ${D.tools[r.tool]}을 선택해 주세요.`);else if(r.code==='craft')notify(`작업대에서 ${D.tools[r.tool]}을 3×3으로 만들어요.`);else notify(r.text||msg[r.code]||'현재 목표부터 해결해요.');return;}
 if(r.code==='workshop')workshop();
 else if(r.code==='puzzle'){if(r.delay){clearInput();actionLock=true;later(()=>{actionLock=false;openPuzzle(r.id);},r.delay);}else openPuzzle(r.id);}
 else if(r.code==='sequence')notify('발판을 직접 밟아요. 눌린 숫자는 초록색 ✓, 다음 숫자는 노란색이에요.');
 else if(r.code==='weight')notify('옆의 상자를 조사해 들고, 저울에서 다시 조사해 내려놓아요.');
 else if(r.code==='carried')notify('상자를 들었어요. 저울 앞으로 가서 놓아요.');
 else if(r.code==='placed'){const p=C.puzzle(s,t.id);notify(`현재 ${p.placed.reduce((n,i)=>n+p.numbers[i],0)}kg / 목표 ${p.target}kg`);}
 else if(r.code==='jump'){jumpQueued=true;notify('부스터 점프!');}
 else if(r.code==='working')notify(`${t.label} · ${r.hits}/${r.total}`);
 else if(r.code==='supply'){const g=C.objective(s);notify(g.kind==='craft'?`재료가 준비됐어요. ${D.tools[g.tool]}을 만들어요.`:'이미 만든 도구를 그대로 사용해요.');effect(t.id,'탐험 준비 완료');}
 else if(['done','cache'].includes(r.code))effect(t.id,r.code==='done'?'장치가 작동했어요!':'보물을 찾았어요!');
 save();refresh();
}
function refresh(){const st=current(),d=C.definition(s),o=C.objective(s);if(document.documentElement.dataset.chapter!==d.id){document.documentElement.dataset.chapter=d.id;document.documentElement.style.setProperty('--scene-accent',MMArt.theme(d.theme).accent);} $('goal').textContent=running?o.text:'모모와 열다섯 세계로 떠나요.';$('status').textContent=`${d.order}장 ${d.title} · ${Math.max(1,Math.min(3,Math.floor((st.y+.2)/8)+1))}층 · ${s.xp} XP`;
 const t=C.currentTask(s);if(t?.type==='sequence'){const p=C.puzzle(s,t.id);$('sequenceInfo').textContent=p.sequence.map((v,i)=>i<p.input.length?v+' ✓':v).join(' → ');}else if(st.plateEvent&&st.clock<st.plateEvent.until){$('sequenceInfo').textContent=st.plateEvent.ok?'발판 성공! 다음 목표로 가요.':'다시 첫 숫자부터 시작해요.';}else $('sequenceInfo').textContent='';
 const old=near;near=C.objects(s).filter(t=>Math.abs(st.x-t.x)<=2&&(Math.abs(st.y-t.floor*8)<2.1)).sort((a,b)=>Math.abs(st.x-a.x)-Math.abs(st.x-b.x))[0]||null;
 $('near').textContent=near?near.label+' · '+(near.kind==='golem'?'말 걸기':near.kind==='generator'?'렌치로 수리':near.kind==='ore'?'곡괭이로 캐기':'조사'):o.kind==='clear'?'메뉴에서 다음 챕터를 선택할 수 있어요.':'← → 이동 · ↑ ↓ 사다리';
 $('use').textContent=st.carried&&near?.kind!=='scale'?'내려놓기':(near?.kind==='golem'||near?.kind==='monster')?'말 걸기':near?.kind==='generator'?'수리':near?.kind==='ore'?'캐기':near?.kind==='weightCrate'?'들기':near?.kind==='scale'&&st.carried?'놓기':'조사';
 for(let i=0;i<5;i++){const b=$('hot'+i);b.classList.toggle('on',st.selectedHotbar===i&&C.owned(s,i));b.classList.toggle('dim',!C.owned(s,i));b.setAttribute('aria-pressed',st.selectedHotbar===i&&C.owned(s,i)?'true':'false');}
}
function step(dt){if(!running||mode||actionLock){if(actionLock){C.move(s,0,0,false,dt);refresh();}return;}const before=C.currentTask(s)?.id,h=(keys.has('right')||[...held.values()].includes('right')?1:0)-(keys.has('left')||[...held.values()].includes('left')?1:0),v=(keys.has('up')||[...held.values()].includes('up')?1:0)-(keys.has('down')||[...held.values()].includes('down')?1:0);C.move(s,h,v,jumpQueued,dt);jumpQueued=false;
 const st=current();if(before&&C.has(s,before)){save();effect(before,'목표를 해결했어요!');}if(st.plateEvent&&st.plateEvent.started!==lastPlateTime){lastPlateTime=st.plateEvent.started;if(!st.plateEvent.ok)notify('순서가 달라요. 다시 첫 숫자부터 시작해요.');}if(st.clock-lastSaved>4)save();refresh();}
function loop(ts){const dt=Math.min(.06,(ts-lastFrame)/1000||0);lastFrame=ts;if(!testMode){acc+=dt;for(let i=0;acc>=1/60&&i<5;i++){step(1/60);acc-=1/60;}}renderer.render(s,near,{mode,modal:!!mode,moving:held.size>0||keys.size>0,effect:worldEffect});requestAnimationFrame(loop);}
$('hotbar').innerHTML=D.tools.map((t,i)=>`<button class="slot dim" id="hot${i}" data-tool="${i}" aria-label="${t} 선택">${icon(i)}<span class="num">${i+1}</span></button>`).join('')+'<button class="slot" id="bagbtn" aria-label="가방">▣</button>';
D.tools.forEach((_,i)=>bind('hot'+i,()=>chooseTool(i)));bind('bagbtn',()=>{if(running)bag();});bind('mapbtn',()=>running?mapUI():title());bind('pausebtn',pause);bind('use',act);
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(running&&!mode&&!actionLock)jumpQueued=true;});
document.querySelectorAll('[data-hold]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(!running||mode||actionLock)return;held.set(e.pointerId,b.dataset.hold);try{b.setPointerCapture(e.pointerId);}catch{}});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>held.delete(e.pointerId));});
const keyMap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
window.addEventListener('keydown',e=>{if(mode){if(e.key==='Escape')close();else if(keyboard){e.preventDefault();keyboard(e);}return;}if(keyMap[e.key]){e.preventDefault();keys.add(keyMap[e.key]);}if(e.code==='Space'){e.preventDefault();if(!e.repeat)jumpQueued=true;}if(e.key.toLowerCase()==='e'&&!e.repeat)act();if(/^[1-5]$/.test(e.key))chooseTool(Number(e.key)-1);if(e.key.toLowerCase()==='i')bag();if(e.key==='Escape')pause();});window.addEventListener('keyup',e=>{if(keyMap[e.key])keys.delete(keyMap[e.key]);});window.addEventListener('blur',()=>{clearInput();save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();save();if(running)pause();}});window.addEventListener('pagehide',()=>{clearInput();save();});
window.MMApp={version:VERSION,visualOptions:()=>({...renderer.options}),get modal(){return mode;},inspect:()=>({campaign:JSON.parse(C.serialize(s)),state:JSON.parse(JSON.stringify(current())),objective:C.objective(s),waypoint:C.waypoint(s),boss:C.bossInfo(s),near:near?.id||null}),save};
// A deterministic clock for Playwright. It advances the exact normal input/physics loop, never teleports or changes flags.
if(testMode)window.MMApp.testFrames=n=>{if(!Number.isInteger(n)||n<0||n>2000)throw new Error('Invalid frame count');for(let i=0;i<n;i++)step(1/60);renderer.render(s,near,{mode,modal:!!mode,effect:worldEffect});};
if(testMode)window.MMApp.testMachineFrames=n=>{if(!Number.isInteger(n)||n<0||n>2000)throw Error('Invalid machine frame count');for(let i=0;i<n;i++)machineView?.tick(1/60);};
title();refresh();requestAnimationFrame(loop);
})();
