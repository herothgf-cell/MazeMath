<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#304732"><meta name="apple-mobile-web-app-capable" content="yes"><title>모모의 블록 탐험 · 10장 모험</title><link rel="stylesheet" href="style.css?v=10.1"></head>
<body><main id="app">
<header><div class="emblem" aria-hidden="true">••</div><div class="headtext"><div class="eyebrow">모모의 블록 탐험 · 10장 업데이트</div><div id="goal">모모와 모험을 시작해요</div><div id="sequenceInfo" aria-live="polite"></div></div><button class="btn small" id="mapbtn">지도</button><button class="btn small" id="pausebtn" aria-label="일시정지">Ⅱ</button></header>
