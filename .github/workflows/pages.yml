name: deploy-pages
on:
  push:
    branches: [main]
    paths:
      - 'Web/Instant/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy modular rule regression
        run: node --test Web/Instant/core.test.cjs
      - name: Build exact 15.2 mobile release
        run: node Web/Instant/quiz/build.cjs
      - name: Verify generated quiz rules, migration and all chapter routes
        run: node --test Web/Instant/quiz/*.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Verify continuous quizzes and HTTP saves in Chromium and WebKit
        run: node Web/Instant/quiz/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-mobile-verification
          path: TestResults/quiz
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
