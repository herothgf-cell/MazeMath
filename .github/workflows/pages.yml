name: deploy-pages
on:
  push:
    branches: [main]
    paths:
      - 'Web/Instant/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify instant-play game rules
        run: node --test Web/Instant/core.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Verify five chapter mobile campaign
        run: node Web/Instant/browser.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/Instant

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
