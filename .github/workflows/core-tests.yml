name: core-tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and test pure C# gameplay
        run: dotnet test Tools/CoreTests/MazeMath.CoreTests.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: ignore
