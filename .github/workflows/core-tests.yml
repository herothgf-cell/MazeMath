name: core-tests

on:
  push:
    branches:
      - feat/maze-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run core tests
        run: dotnet test Tools/CoreTests/MazeMath.CoreTests.csproj --configuration Release --verbosity normal
